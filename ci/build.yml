# Каноническая копия workflow сборки.
#
# GitHub читает workflow только из .github/workflows/. Этот файл — та же
# копия, но в обычном каталоге: его можно открыть и нажать "Copy raw contents",
# затем вставить в .github/workflows/build.yml через редактор GitHub.
#
# Отличия от версии, которая падала:
#   - build.sh запускается через bash, а не ./build.sh: в репозитории у
#     build.sh нет бита исполнения, из-за чего был exit 126;
#   - при чистке диска node из тулкэша не удаляется (на нём работают
#     upload-artifact и cache);
#   - поиск собранных пакетов идёт по всему дереву bin/packages;
#   - gh release получает --repo, т.к. шаг работает вне каталога репозитория.
#
name: Build

# Полная сборка порта OpenWrt для Perenio Elegance (PEJIR01).
#
# Что делает:
#   - применяет серию патчей к чистому OpenWrt v25.12.6;
#   - достаёт вендорские бинари из заводской прошивки Perenio 9.0.4;
#   - собирает образ;
#   - проверяет, что в собранном rootfs реально лежат ожидаемые файлы
#     (регрессии вроде "smsd.conf не установился" ловятся здесь);
#   - отдаёт образы артефактом и, при пуше тега, прикрепляет их к Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKDIR: ${{ github.workspace }}/openwrt-pejir01-build

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # На GitHub-hosted раннере свободно ~14 ГБ, а OpenWrt с этим набором
      # пакетов требует ~30 ГБ. Без этого шага сборка упадёт по месту.
      # ВАЖНО: node из тулкэша не удаляем — на нём работают node-овые
      # экшены (upload-artifact, cache), без него они падают.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/boost /usr/local/share/powershell \
                     /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python \
                     /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go \
                     /opt/hostedtoolcache/Java_* /opt/hostedtoolcache/ruby \
                     /opt/hostedtoolcache/swift /opt/hostedtoolcache/terraform
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Cache downloads and build tree
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKDIR }}/openwrt/dl
            ${{ env.WORKDIR }}/openwrt/build_dir
            ${{ env.WORKDIR }}/openwrt/staging_dir
          key: pejir-${{ hashFiles('patches/*.patch', 'build.sh') }}
          restore-keys: |
            pejir-

      - name: Build
        run: |
          set -o pipefail
          # build.sh в репозитории не имеет бита исполнения, поэтому
          # запускаем его через bash (иначе exit 126: Permission denied).
          chmod +x build.sh
          bash build.sh 2>&1 | tee build.log

      - name: Verify image contents
        run: |
          set -e
          BIN="$WORKDIR/openwrt/bin/targets/ramips/mt7621"
          ROOTFS="$(ls "$BIN"/*-rootfs.squashfs | head -1)"
          PKGDIR="$WORKDIR/openwrt/bin/packages/ramips/mt7621"
          fail=0

          command -v unsquashfs >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
          }

          check_file() {
            if unsquashfs -l "$ROOTFS" 2>/dev/null | grep -q "$1"; then
              echo "  ok   rootfs: $1"
            else
              echo "  FAIL rootfs: $1 отсутствует"
              fail=1
            fi
          }
          check_pkg() {
            if find "$PKGDIR" -name "$1*.apk" 2>/dev/null | grep -q .; then
              echo "  ok   package: $1"
            else
              echo "  FAIL package: $1 не собран"
              fail=1
            fi
          }

          echo "== содержимое rootfs =="
          # конфиг smstools3 (регрессия: ставился только uci-defaults, но не сам файл)
          check_file "etc/smsd.conf"
          # скрипты миграции со стока и настройки LTE
          check_file "etc/uci-defaults/20-pejir-idata"
          check_file "etc/uci-defaults/40-pejir-lte"
          # вендорные бинари
          check_file "usr/bin/mcud"
          check_file "usr/sbin/idata_load"
          # LuCI-приложения PEJIR01
          check_file "www/luci-static/resources/view/perenio/battery.js"
          check_file "www/luci-static/resources/view/perenio/sms.js"
          # разбор MAC из idata: кавычки должны сниматься со всей строки
          if unsquashfs -cat "$ROOTFS" etc/board.d/02_network 2>/dev/null \
               | grep -q 'tr -d' ; then
            echo "  ok   02_network: парсер MAC снимает кавычки"
          else
            echo "  FAIL 02_network: старый парсер MAC"
            fail=1
          fi

          echo "== собранные пакеты =="
          check_pkg "luci-app-perenio"
          check_pkg "pejir-idata"
          check_pkg "pejir-sms"
          check_pkg "pejir-lte-base"
          check_pkg "perenio-mcu"

          echo "== образы =="
          ls -la "$BIN"/*.bin
          exit $fail

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: pejir01-images
          path: |
            ${{ env.WORKDIR }}/openwrt/bin/targets/ramips/mt7621/*.bin
            ${{ env.WORKDIR }}/openwrt/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd "$WORKDIR/openwrt/bin/targets/ramips/mt7621"
          sha256sum *.bin > sha256sums
          files=$(ls *.bin)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" $files sha256sums --clobber --repo "$REPO"
          else
            gh release create "$TAG" $files sha256sums --repo "$REPO" \
              --title "Perenio Elegance PEJIR01 — OpenWrt 25.12.6" \
              --notes "Сборка из GitHub Actions."
          fi
